<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- White circle background -->
  <circle cx="160" cy="160" r="155" fill="#f0f4fa" stroke="#d0d8e8" stroke-width="2"/>

  <!-- Shield outer (dark navy) -->
  <path d="M160 30 L220 58 L220 130 Q220 185 160 215 Q100 185 100 130 L100 58 Z"
        fill="#1a3a6e" />

  <!-- Shield middle (white ring) -->
  <path d="M160 44 L210 68 L210 130 Q210 178 160 205 Q110 178 110 130 L110 68 Z"
        fill="white" />

  <!-- Shield inner (bright blue) -->
  <path d="M160 58 L200 78 L200 130 Q200 170 160 194 Q120 170 120 130 L120 78 Z"
        fill="#1a56db" />

  <!-- Padlock body -->
  <rect x="143" y="130" width="34" height="28" rx="4" fill="white" opacity="0.95"/>

  <!-- Padlock shackle -->
  <path d="M152 130 L152 120 Q152 108 160 108 Q168 108 168 120 L168 130"
        fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>

  <!-- Padlock keyhole -->
  <circle cx="160" cy="142" r="4" fill="#1a56db"/>
  <rect x="158" y="144" width="4" height="7" rx="1" fill="#1a56db"/>

  <!-- Text: SecureAI -->
  <text x="160" y="248"
        font-family="Arial Black, Arial, sans-serif"
        font-size="34"
        font-weight="900"
        fill="#1a3a6e"
        text-anchor="middle"
        letter-spacing="-0.5">SecureAI</text>

  <!-- Text: Labs -->
  <text x="160" y="283"
        font-family="Arial Black, Arial, sans-serif"
        font-size="36"
        font-weight="900"
        fill="#1a56db"
        text-anchor="middle"
        letter-spacing="1">Labs</text>

  <!-- Tagline -->
  <text x="160" y="308"
        font-family="Arial, sans-serif"
        font-size="11.5"
        font-weight="700"
        fill="#1a56db"
        text-anchor="middle"
        letter-spacing="1.5">SECURE TODAY, EMPOWER TOMORROW</text>
</svg>
